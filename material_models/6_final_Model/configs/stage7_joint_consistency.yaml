stage5b_energy_checkpoint: '@project/6_final_Model/checkpoints/stage5b/hierarchical_fast_slow_energy_network_pareto.pt'
stage4_checkpoint: '@project/6_final_Model/checkpoints/stage4/gdpicnn_stage4_selected.pt'
stage6_checkpoint: '@project/6_final_Model/checkpoints/stage6/edpicnn_stage6_selected.pt'
teacher_anchor_cache: '@project/6_final_Model/audit/stage2/stage2_teacher_cache.npz'
