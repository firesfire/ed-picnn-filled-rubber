    Rneq_decade: 0.08
    Rneq_stage: 0.08
    R: 0.03
    loading: 0.05
    storage: 0.28
    loss: 0.02
    tan_delta: 0.03
  dissipation:
    q_log: 0.05
    q_ordering: 0.02
    q_slope: 0.03
    Rneq: 0.46
    Rneq_decade: 0.46
    Rneq_stage: 0.42
    R: 0.08
    loading: 0.06
    storage: 0.03
    loss: 0.28
    tan_delta: 0.14
  joint:
    q_log: 0.25
    q_ordering: 0.08
    q_slope: 0.12
    Rneq: 0.30
    Rneq_decade: 0.30
    Rneq_stage: 0.28
    R: 0.06
    loading: 0.06
    storage: 0.14
    loss: 0.17
    tan_delta: 0.09

