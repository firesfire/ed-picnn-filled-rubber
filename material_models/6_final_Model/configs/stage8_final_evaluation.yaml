complex_paths:
  cyclic_shear:
    amplitude: 0.40
    frequency_Hz: 0.20
    cycles: 2
    points_per_cycle: 16
  multilevel_shear:
    time_s: [0.0, 0.5, 5.0, 5.5, 15.0, 15.5, 25.0, 25.5, 40.0]
    level: [0.0, 0.20, 0.20, 0.50, 0.50, 0.30, 0.30, 0.70, 0.70]
  load_unload_reload_uniaxial:
    time_s: [0.0, 1.0, 5.0, 6.0, 10.0, 11.0, 20.0]
    level: [0.0, 0.60, 0.60, 0.10, 0.10, 0.80, 0.80]
  planar_relaxation:
    time_s: [0.0, 1.0, 5.0, 20.0]
    level: [0.0, 0.50, 0.50, 0.50]
  equibiaxial_relaxation:
    time_s: [0.0, 1.0, 5.0, 20.0]
    level: [0.0, 0.25, 0.25, 0.25]
  preload_dma:
    preload: 0.30
    amplitude: 0.02
    frequency_Hz: 1.0
    points_per_cycle: 48
    maximum_cycles: 8
    steady_tolerance: 5.0e-4
  creep_shear:
    time_s: [0.0, 0.2, 1.0, 3.0, 10.0, 30.0]
    stress_MPa: [0.0, 0.12, 0.12, 0.12, 0.12, 0.12]

finite_element:
