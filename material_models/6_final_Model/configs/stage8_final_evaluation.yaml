  zhang_li_equilibrium_energy: true
  tau_s: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  frequency_amplitude_fraction: 0.001
  amplitude_dma_role: external_diagnostic_only
  amplitude_labels_used_for_gradient: false

eligible_models:
  - T2-Ogden
  - D-PICNN
  - GD-PICNN
  - E-PICNN
  - ED-PICNN

