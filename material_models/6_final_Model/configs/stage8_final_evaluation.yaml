  initial_level: 0.20
  final_level: 0.22
  time_step_s: 0.10
  finite_difference_step: 1.0e-5
  extreme_modes: [shear, uniaxial]
  extreme_levels: [0.01, 0.05, 0.10, 0.25, 0.50, 1.00]
  extreme_time_steps_s: [0.0001, 0.01, 1.0, 100.0]
  maximum_tangent_relative_error: 0.01
  maximum_detFv_error: 1.0e-8

stability_domain:
  uniaxial: [0.0, 2.0, 13]
  shear: [0.0, 1.5, 13]
  planar: [0.0, 1.5, 11]
  equibiaxial: [0.0, 0.80, 11]
  acoustic_directions_per_state: 10

outputs:
