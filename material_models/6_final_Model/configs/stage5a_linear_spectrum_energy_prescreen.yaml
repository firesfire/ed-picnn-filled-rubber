schema_version: '2026-08-31-chapter3-stage5a-v1'
status: stage5a_linear_spectrum_and_energy_architecture_prescreen

teacher_parameter_file: '@project/2_TeacherModel/results_chapter2_fair_comparison/parameters/T2_chapter2_joint_evaluation_parameters.json'
real_training_cache: '@project/6_final_Model/audit/stage3/stage3_real_training_data.json'
stage4_checkpoint: '@project/6_final_Model/checkpoints/stage4/gdpicnn_stage4_selected.pt'
stage4_parameter_file: '@project/6_final_Model/results/stage4/gdpicnn_stage4_selected_parameters.json'

frozen:
  zhang_li_equilibrium_energy: true
  tau_s: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  frequency_amplitude_fraction: 0.001
  frequency_split: 'training frequencies fit; 5--20 Hz contiguous interval validation'
  stage4_dissipation_potential: true

linear_spectrum:
  loss_weight_grid: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  ridge_grid: [0.0, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-3, 1.0e-2]
  smoothness_grid: [0.0, 1.0e-6, 1.0e-4, 1.0e-3, 1.0e-2]
  active_weight_threshold_MPa: 1.0e-6
  practical_singular_value_ratio: 1.0e-6
  bootstrap_repeats: 200
  bootstrap_seed: 20260831

energy_prescreen:
  candidates:
    - shared_low_parameter_saturation
    - grouped_fast_slow_saturation
    - shared_saturating_energy_network
    - hierarchical_fast_slow_energy_network
  seeds: [20260831, 20260832, 20260833, 20260834, 20260835]
  epochs: 1500
  learning_rate: 0.025
  gradient_clip: 10.0
  ridge_count_shared: 4
  ridge_count_grouped: 3
  saturation_power_bounds: [0.50, 1.00]
  saturation_b_bounds: [1.0e-3, 1.0e4]
  q_log_weight: 1.0
  mode_slope_weight: 1.00
  q_ordering_weight: 20.00
  path_tangent_penalty: 0.20
  parameter_regularization: 1.0e-5

stability_screen:
  uniaxial_stretch: [1.0, 2.0, 17]
  shear: [0.0, 0.8, 17]
  planar_stretch: [1.0, 2.0, 13]
  equibiaxial_stretch: [1.0, 1.5, 13]
  acoustic_directions_per_state: 24
  acoustic_seed: 20260831
  minimum_allowed_projected_modulus_MPa: -1.0e-6
  minimum_allowed_path_tangent_MPa: -1.0e-5

acceptance:
  linear_spectrum_validation_balanced_nrmse_maximum: 0.35
  linear_spectrum_storage_relative_rmse_maximum: 0.15
  linear_spectrum_loss_relative_rmse_maximum: 0.35
  require_reference_zero_energy_stress_force: true
  require_positive_energy_on_screen: true
  require_continuous_finite_stress: true
  require_no_acoustic_instability_in_declared_domain: true
  require_q_log_rmse_below_stage4: true
  require_q_ordering_by_mode: true

outputs:
  results_dir: '@project/6_final_Model/results/stage5a'
  figures_dir: '@project/6_final_Model/figures/stage5a'
  checkpoint_dir: '@project/6_final_Model/checkpoints/stage5a'
